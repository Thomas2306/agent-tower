# Costruisce AGENT TOWER su Windows, Mac e Linux (macchine vere di GitHub) e lascia i pacchetti
# da scaricare nella pagina dell'esecuzione. Non pubblica niente da solo.
name: pacchetti

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  pacchetto:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cmd: pacchetto:win
          - os: macos-latest
            cmd: pacchetto:mac
          - os: ubuntu-latest
            cmd: pacchetto:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc -p . --noEmit
      - run: npm run ${{ matrix.cmd }}
        env:
          # niente firma: i pacchetti sono "da provare" (su Mac: clic destro → Apri la prima volta)
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: agent-tower-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
